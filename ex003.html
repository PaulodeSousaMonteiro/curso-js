<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu primeiro progama...</title>
    <style>
        body{
            background-color: rgb(255, 255, 255);
            color: rgb(0, 0, 0);
            font: normal 25pt Arial;
        }
        h1{
            color: rgb(0, 26, 255);
        }
    </style>
</head>
<body>
   <h1>Olá, mundo!</h1>
   <p>Já me livrei da maldição</p>
   <script>
    var n1 = Number(window.prompt('Digite um número: '))//Number()- para transformar um dado string em um dado number (tanto inteiro quanto com virgula)
    var n2 = Number(window.prompt('Digite outro número: '))//Number.parsInt() - para transformar em número inteiro / Number.parseFloat - para transformar em número com vírgula
    var s = n1 + n2 //para conseguir colocar a soma no window.alert
    window.alert(`A soma entre ${n1} e ${n2}  é ` + s + '!')// se escrever entre `` voce pode usar "${}" para aparecer uma var no texto
   </script>
</body>
</html>
