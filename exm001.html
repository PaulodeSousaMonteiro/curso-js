<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <style>
        body{
            font: normal 20pt Arial;
        }
    </style>
</head>
<body>
    <script>
        var nome = window.prompt('Qual seeu nome?')
        var idade = window.prompt('Informe sua idade?')
        var n1 = Number(prompt('Me diga um número;'))
        var n2 = Number(prompt('Me dia outro número:'))
        var ressoma = n1 + n2
        var ressub = n1 - n2
        var resmult = n1 * n2
        var resdiv = n1 / n2
        var mom = idade >= 18? 'maior'  : 'menor'
        document.write(`<h1>Olá ${nome}, você tem ${idade} anos!</br></h1>`)
        document.write(`Você é de ${mom}</br>`)
        document.write(`A soma dos valores é ${ressoma}</br>`)
        document.write(`A subtração dos valores resulta em  ${ressub}</br>`)
        document.write(`A multiplicação dos valores resulta em ${resmult}!</br>`)
        document.write(`A divisão dos valores resulta em ${resdiv}!`)
    </script>
</body>
</html>
