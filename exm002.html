<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESTRANGEIRO</title>
</head>
<body>
    <h1>Você é Brasileiro?</h1>
    Diga o país que você mora: <input type="text" name="txtp" id="txtp">
    <input type="button" value="Verificar" onclick="verif()">
    <div id = 'res'>

    </div>
    <script>
        function verif() {
            var p = window.document.querySelector('input#txtp')
            var res = window.document.querySelector('div#res')
            var país = (p.value)
            res.innerHTML = 'Você é '
            if (país == 'Brasil') {
                res.innerHTML += '<strong>Brasileiro</strong>'
            } else {
                res.innerHTML += '<strong>Estrangeiro</strong>'
            }
        }
    </script>
</body>
</html>
